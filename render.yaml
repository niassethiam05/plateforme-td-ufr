# Deploiement sur Render (https://render.com) : un seul service web qui sert
# a la fois l'API et les pages du site. Marche a suivre : docs/deploiement.md.
services:
  - type: web
    name: plateforme-td-ufr
    runtime: node
    # "free" pour la phase de test (le service s'endort apres 15 minutes sans
    # visite). Passer a "starter" pour la mise en service reelle.
    plan: free
    region: frankfurt
    # --include=dev : NODE_ENV=production ferait sinon ignorer TypeScript,
    # Prisma et Vite, dont la construction a besoin.
    buildCommand: npm ci --include=dev && npm run build
    # Applique les migrations en attente, puis demarre le serveur.
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      - key: SERVE_FRONTEND
        value: "true"
      - key: TRUST_PROXY
        value: "1"

      # Secrets generes par Render a la creation, jamais ecrits dans le depot.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # Base de donnees (Neon) : chaine de connexion directe, sans "pooler".
      - key: DATABASE_URL
        sync: false

      # Stockage des PDF (Cloudflare R2).
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_FORCE_PATH_STYLE
        value: "true"

      # Premier compte administrateur (sans effet des qu'un admin existe).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # Emails "mot de passe oublie". Peuvent rester vides au debut.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

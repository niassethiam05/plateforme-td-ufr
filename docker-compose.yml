services:
  postgres:
    image: postgres:16-alpine
    container_name: td-ufr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: td_ufr
      POSTGRES_PASSWORD: td_ufr_password
      POSTGRES_DB: td_ufr_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U td_ufr -d td_ufr_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: td-ufr-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # API S3-compatible
      - "9001:9001" # Console web MinIO
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cree automatiquement le bucket utilise par le backend au demarrage.
  # Le bucket reste prive : aucun acces anonyme n'est accorde. Les fichiers
  # sont servis exclusivement via des URLs signees generees par le backend
  # (voir StorageProvider.getSignedUrl), apres verification du role/statut.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/td-ufr-fichiers
      "

volumes:
  postgres_data:
  minio_data:
